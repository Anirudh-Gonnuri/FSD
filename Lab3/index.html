<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fitness Tracker Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .selected-label {
      @apply bg-green-100 border-green-500 ring-2 ring-green-300;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-xl bg-white shadow-lg rounded-xl p-8 space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-800">Fitness Tracker Signup</h2>
    
    <form id="fitnessForm" class="space-y-4">
      <div>
        <label for="fullName" class="block font-medium mb-1">Full Name</label>
        <input type="text" id="fullName" name="fullName" required class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:border-blue-400"/>
      </div>

      <div>
        <label for="email" class="block font-medium mb-1">Email</label>
        <input type="email" id="email" name="email" required class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:border-blue-400"/>
      </div>

      <div>
        <label for="goal" class="block font-medium mb-1">Fitness Goal</label>
        <select id="goal" name="goal" required class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:border-blue-400">
          <option value="">-- Select Goal --</option>
          <option>Weight Loss</option>
          <option>Muscle Gain</option>
          <option>Endurance</option>
          <option>General Fitness</option>
        </select>
      </div>

      <fieldset>
        <legend class="font-medium mb-2">Preferred Workout Times</legend>
        <div class="flex flex-wrap gap-3">
          <label class="checkbox-label border border-gray-300 p-2 rounded-md cursor-pointer">
            <input type="checkbox" name="preferredTime" value="Morning" class="hidden">
            Morning
          </label>
          <label class="checkbox-label border border-gray-300 p-2 rounded-md cursor-pointer">
            <input type="checkbox" name="preferredTime" value="Afternoon" class="hidden">
            Afternoon
          </label>
          <label class="checkbox-label border border-gray-300 p-2 rounded-md cursor-pointer">
            <input type="checkbox" name="preferredTime" value="Evening" class="hidden">
            Evening
          </label>
          <label class="checkbox-label border border-gray-300 p-2 rounded-md cursor-pointer">
            <input type="checkbox" name="preferredTime" value="Night" class="hidden">
            Night
          </label>
        </div>
      </fieldset>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Submit</button>
    </form>

    <div id="output" class="hidden bg-gray-50 border border-gray-300 rounded-lg p-4 mt-4 space-y-2">
      <h3 class="font-bold text-lg">Submitted Info:</h3>
      <p><strong>Name:</strong> <span id="outName"></span></p>
      <p><strong>Email:</strong> <span id="outEmail"></span></p>
      <p><strong>Goal:</strong> <span id="outGoal"></span></p>
      <p><strong>Preferred Times:</strong> <span id="outTimes"></span></p>
    </div>
  </div>

  <script src="script.js">
  </script>
</body>
</html>
